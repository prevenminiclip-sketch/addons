AWSTemplateFormatVersion: '2010-09-09'
Description: 'Deploy Movy.sx Stremio Addon with automated Let''s Encrypt HTTPS on AWS EC2 Free Tier'

Parameters:
  AccessKey:
    Type: String
    Description: 'Secret token to protect your addon from unauthorized users & scrapers'
    Default: 'my_secret_token_2026'
    NoEcho: false

  DuckDnsDomain:
    Type: String
    Description: 'Optional: Your DuckDNS domain (e.g. my-easynews-plus.duckdns.org). Leave blank to use automated sslip.io'
    Default: ''

  DuckDnsToken:
    Type: String
    Description: 'Optional: Your DuckDNS API Token from https://duckdns.org. Leave blank if not using DuckDNS'
    Default: ''
    NoEcho: true

  InstanceType:
    Type: String
    Description: 'EC2 Instance Type (t3.micro is Free Tier eligible)'
    Default: 't3.micro'
    AllowedValues:
      - 't3.micro'
      - 't3.small'
      - 't4g.micro'
      - 't4g.small'

  LatestUbuntuAmi:
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Description: 'Auto-resolved latest Canonical Ubuntu 22.04 LTS AMI for the target region'
    Default: '/aws/service/canonical/ubuntu/server/22.04/stable/current/amd64/hvm/ebs-gp2/ami-id'

Conditions:
  HasDuckDns: !Not [!Equals [!Ref DuckDnsDomain, '']]

Resources:
  # 1. Isolated VPC
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: movy-stremio-vpc

  # 2. Internet Gateway
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: movy-stremio-igw

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # 3. Public Subnet
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: movy-stremio-public-subnet

  # 4. Route Table
  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: movy-stremio-rt

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref RouteTable

  # 5. Security Group (Ports 80 & 443 open)
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP and HTTPS for Movy Stremio Addon
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: Allow HTTP for Lets Encrypt ACME
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: Allow HTTPS for Stremio Addon
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
          Description: Allow SSH management
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: movy-stremio-sg

  # 6. EC2 Instance (Auto-bootstrapped via UserData)
  EC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestUbuntuAmi
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds:
        - !Ref SecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: movy-stremio-addon
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e
          exec > /var/log/movy-bootstrap.log 2>&1

          echo "=== Starting Movy Addon Bootstrap on AWS ==="

          # 1. Update OS and install Docker
          apt-get update -y
          apt-get install -y ca-certificates curl gnupg git

          # Add Docker official GPG key & repo
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          chmod a+r /etc/apt/keyrings/docker.gpg

          echo \
            "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu \
            $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | \
            tee /etc/apt/sources.list.d/docker.list > /dev/null

          apt-get update -y
          apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

          systemctl enable docker
          systemctl start docker

          # 2. Setup 1GB swapfile for t3.micro memory buffer
          fallocate -l 1G /swapfile || dd if=/dev/zero of=/swapfile bs=1M count=1024
          chmod 600 /swapfile
          mkswap /swapfile
          swapon /swapfile
          echo '/swapfile none swap sw 0 0' >> /etc/fstab

          # 3. Detect Public IPv4
          PUBLIC_IP=""
          for i in {1..10}; do
            PUBLIC_IP=$(curl -s https://api.ipify.org || curl -s https://ifconfig.me || echo "")
            if [ -n "$PUBLIC_IP" ]; then break; fi
            sleep 2
          done

          # 4. Determine Domain (DuckDNS vs sslip.io)
          DUCK_DOM="${DuckDnsDomain}"
          DUCK_TOK="${DuckDnsToken}"

          if [ -n "$DUCK_DOM" ]; then
            DOMAIN="$DUCK_DOM"
            if [ -n "$DUCK_TOK" ]; then
              # Auto-update DuckDNS with this EC2 public IP
              SUB=$(echo "$DUCK_DOM" | sed 's/\.duckdns\.org//')
              curl -s "https://www.duckdns.org/update?domains=$SUB&token=$DUCK_TOK&ip=$PUBLIC_IP" || true
            fi
          elif [ -n "$PUBLIC_IP" ]; then
            DOMAIN="${!PUBLIC_IP}.sslip.io"
          else
            DOMAIN="localhost"
          fi

          echo "Public IP: $PUBLIC_IP"
          echo "Configuring Domain: $DOMAIN"

          # 5. Clone Addon Repository
          mkdir -p /opt/movy-stremio-addon
          cd /opt/movy-stremio-addon
          git clone https://github.com/charlietrp77-cmd/movy-stremio-addon.git .

          # 6. Write Environment Configuration
cat <<ENVEOF > .env
DOMAIN=${!DOMAIN}
DUCKDNS_DOMAIN=${DuckDnsDomain}
DUCKDNS_TOKEN=${DuckDnsToken}
ACCESS_KEY=${AccessKey}
PORT=7000
CADDY_HTTPS_PORT=443
ENVEOF

          # 7. Start Containers
          docker compose up -d --build

          echo "=== Movy Addon Successfully Deployed ==="

Outputs:
  PublicIp:
    Description: Public IPv4 Address
    Value: !GetAtt EC2Instance.PublicIp

  Hostname:
    Description: Automated SSL Hostname
    Value: !If
      - HasDuckDns
      - !Sub "https://${DuckDnsDomain}"
      - !Sub "https://${EC2Instance.PublicIp}.sslip.io"

  StremioManifestUrl:
    Description: "🎉 Protected Stremio Manifest URL - Copy and paste this directly into Stremio!"
    Value: !If
      - HasDuckDns
      - !Sub "https://${DuckDnsDomain}/${AccessKey}/manifest.json"
      - !Sub "https://${EC2Instance.PublicIp}.sslip.io/${AccessKey}/manifest.json"
