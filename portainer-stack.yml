version: "3.8"

# =============================================================================
# Portainer Stack: Movy Stremio Addon (Stable Base)
# Automatic DuckDNS DNS-01 SSL on port 443 (Port 80 untouched for Solar Assistant)
# =============================================================================

services:
  movy-stremio-addon:
    build:
      context: https://github.com/charlietrp77-cmd/movy-stremio-addon.git#v1.1.1-stable
    container_name: movy-stremio-addon
    restart: unless-stopped
    network_mode: "host"
    environment:
      - PORT=7000
      - NODE_ENV=production
      - ACCESS_KEY=${ACCESS_KEY:-}
      - SOCKS_PROXY=${SOCKS_PROXY:-}

  caddy:
    build:
      context: https://github.com/charlietrp77-cmd/movy-stremio-addon.git#v1.1.1-stable
      dockerfile: Dockerfile.caddy
    container_name: movy-caddy-ssl
    restart: unless-stopped
    network_mode: "host"
    environment:
      - DOMAIN=${DOMAIN:-my-easynews-plus.duckdns.org}
      - DUCKDNS_TOKEN=${DUCKDNS_TOKEN:-}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - movy-stremio-addon

volumes:
  caddy_data:
  caddy_config:
