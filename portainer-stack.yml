version: "3.8"

# =============================================================================
# Portainer Stack: Movy.sx Stremio Addon (Self-Contained with DuckDNS & Caddy)
# =============================================================================
# Services:
#   1. movy-stremio-addon  -> Direct HLS 4K/1080p Stremio Addon server
#   2. caddy               -> Automated HTTPS (Let's Encrypt DNS-01 via DuckDNS)
#
# Stremio Manifest URL: https://<your-subdomain>.duckdns.org/manifest.json
# =============================================================================

services:
  movy-stremio-addon:
    build:
      context: .
      dockerfile: Dockerfile
    image: movy-stremio-addon:latest
    container_name: movy-stremio-addon
    restart: unless-stopped
    ports:
      - "${PORT:-7000}:7000"
    environment:
      - PORT=7000
      - NODE_ENV=production
    networks:
      - movy_net

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    image: movy-caddy-duckdns:latest
    container_name: movy-caddy-ssl
    restart: unless-stopped
    ports:
      - "${CADDY_HTTPS_PORT:-443}:443"
    environment:
      - DUCKDNS_DOMAIN=${DUCKDNS_DOMAIN:-my-easynews-plus.duckdns.org}
      - DUCKDNS_TOKEN=${DUCKDNS_TOKEN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - movy_net
    depends_on:
      - movy-stremio-addon

volumes:
  caddy_data:
  caddy_config:

networks:
  movy_net:
    driver: bridge
