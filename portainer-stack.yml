version: "3.8"

# =============================================================================
# Portainer Stack: Movy.sx Stremio Addon (Standalone Stack)
# Shares CineStream's network (cinestream_net) for DuckDNS HTTPS via Caddy
# =============================================================================

services:
  movy-stremio-addon:
    image: movy-stremio-addon:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: movy-stremio-addon
    restart: unless-stopped
    ports:
      - "${PORT:-7000}:7000"
    environment:
      - PORT=7000
      - NODE_ENV=production
    networks:
      - cinestream_net

networks:
  cinestream_net:
    name: cinestream_net
    external: true
