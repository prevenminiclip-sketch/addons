version: "3.8"

services:
  movy-stremio-addon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: movy-stremio-addon
    restart: unless-stopped
    ports:
      - "7000:7000"
    environment:
      - PORT=7000
      - NODE_ENV=production
      - ACCESS_KEY=${ACCESS_KEY:-}
      # On residential/home IP, no SOCKS proxy is needed (leave empty for direct connection)
      - SOCKS_PROXY=${SOCKS_PROXY:-}
