version: "3.8"

services:
  movy-stremio-addon:
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    container_name: movy-stremio-addon
    restart: unless-stopped
    ports:
      # Bind only to localhost so external traffic MUST route securely through Caddy / HTTPS
      - "127.0.0.1:${PORT:-7000}:7000"
    environment:
      - PORT=7000
      - NODE_ENV=production
      - ACCESS_KEY=${ACCESS_KEY:-}
    networks:
      - movy_net

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    pull_policy: build
    container_name: movy-caddy-ssl
    restart: unless-stopped
    ports:
      - "${CADDY_HTTPS_PORT:-443}:443"
    environment:
      - DUCKDNS_DOMAIN=${DUCKDNS_DOMAIN:-my-easynews-plus.duckdns.org}
      - DUCKDNS_TOKEN=${DUCKDNS_TOKEN}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - movy_net
    depends_on:
      - movy-stremio-addon

volumes:
  caddy_data:
  caddy_config:

networks:
  movy_net:
    driver: bridge
