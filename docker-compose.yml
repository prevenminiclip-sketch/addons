version: "3.8"

# =============================================================================
# Movy.sx Stremio Addon (Standalone Stack)
# Connects to EasyNews Caddy network (stremio_net) for DuckDNS HTTPS
# =============================================================================

services:
  movy-stremio-addon:
    image: movy-stremio-addon:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: movy-stremio-addon
    restart: unless-stopped
    ports:
      - "${PORT:-7000}:7000"
    environment:
      - PORT=7000
      - NODE_ENV=production
    networks:
      - stremio_net

networks:
  stremio_net:
    name: stremio_net
    external: true
