version: "3.8"

services:
  movy-stremio-addon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: movy-stremio-addon
    restart: unless-stopped
    network_mode: "host"
    environment:
      - PORT=7000
      - NODE_ENV=production
      - ACCESS_KEY=${ACCESS_KEY:-}
      - SOCKS_PROXY=${SOCKS_PROXY:-}

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    container_name: movy-caddy-ssl
    restart: unless-stopped
    network_mode: "host"
    environment:
      - DOMAIN=${DOMAIN:-}
      - DUCKDNS_DOMAIN=${DUCKDNS_DOMAIN:-}
      - DUCKDNS_TOKEN=${DUCKDNS_TOKEN:-}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - movy-stremio-addon

volumes:
  caddy_data:
  caddy_config:
